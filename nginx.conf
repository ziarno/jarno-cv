# Static-site server config for the CV. Mounted over nginx's default site.
server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Don't advertise the version in headers or error pages.
    server_tokens off;

    charset utf-8;

    # Basic hardening. No inline-script CSP here: index.html has one inline
    # script (the pre-paint theme read), so a strict script-src would break it.
    add_header X-Content-Type-Options nosniff             always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;
    add_header X-Frame-Options        SAMEORIGIN          always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_types        text/plain text/css application/javascript image/svg+xml application/json;

    # Cache policy uses `expires` rather than `add_header Cache-Control`: an
    # add_header inside a location REPLACES every inherited add_header, which
    # would silently drop the security headers above. `expires` emits
    # Cache-Control on its own and leaves inheritance intact.

    # Content is edited in place, so let the browser revalidate it.
    location = /index.html {
        expires -1;
    }

    # Filenames aren't fingerprinted, so keep these short and revalidated.
    location /assets/ {
        expires 7d;
    }

    location ~* \.(css|js)$ {
        expires 1h;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Health endpoint for the container healthcheck / reverse proxy.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
