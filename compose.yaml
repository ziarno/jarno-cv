services:
  cv:
    build: .
    image: jarno-cv:latest
    container_name: jarno-cv
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    networks:
      - web

networks:
  web:
    external: true
